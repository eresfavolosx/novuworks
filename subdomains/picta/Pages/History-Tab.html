<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="description" content="Picta: Saved Assistive Snapshots & Color Analysis Gallery">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Picta · Snapshot History</title>

    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/material-design-lite/1.3.0/material.indigo-pink.min.css" integrity="sha384-JJ+iHMcntyq9rnkF4oIzyQXskFjLfjcUCV9hE9UjmW1RCJEU58AN2mkle9Bm+YRx" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="../Assets/CSS/style.css">
</head>

<body class="picta-body">
    <div class="picta-page-container">
        <!-- Page Header -->
        <header class="page-header">
            <div class="page-title-row">
                <a href="../index.html" class="icon-btn" title="Back to Camera" aria-label="Back to Camera">
                    <i class="material-icons">arrow_back</i>
                </a>
                <h1 class="page-title">Snapshot History</h1>
            </div>
            <div>
                <button id="btn-clear-all" class="icon-btn" title="Clear All History" aria-label="Clear All History">
                    <i class="material-icons">delete_sweep</i>
                </button>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="page-content-area">
            <div id="history-container">
                <!-- Dynamically rendered snapshots -->
            </div>
        </main>

        <!-- Bottom Navigation Bar -->
        <footer class="picta-bottom-bar" style="position: fixed; bottom: 0; left: 0; right: 0;">
            <a href="History-Tab.html" class="nav-tab-btn active" title="Saved Snapshots">
                <i class="material-icons">history</i>
                <span class="nav-label">History</span>
            </a>
            <div class="shutter-wrapper">
                <a href="../index.html" class="shutter-btn" title="Return to Live Camera" aria-label="Camera">
                    <div class="shutter-inner" style="background: var(--picta-primary);">
                        <i class="material-icons shutter-icon">photo_camera</i>
                    </div>
                </a>
            </div>
            <a href="Settings-Tab.html" class="nav-tab-btn" title="App Settings">
                <i class="material-icons">tune</i>
                <span class="nav-label">Settings</span>
            </a>
        </footer>
    </div>

    <!-- Script to render & manage snapshots -->
    <script>
        (function() {
            const container = document.getElementById('history-container');
            const btnClearAll = document.getElementById('btn-clear-all');

            function getSnapshots() {
                try {
                    const data = localStorage.getItem('picta_snapshots');
                    return data ? JSON.parse(data) : [];
                } catch (e) {
                    return [];
                }
            }

            function saveSnapshots(list) {
                try {
                    localStorage.setItem('picta_snapshots', JSON.stringify(list));
                } catch (e) {
                    console.warn(e);
                }
            }

            function isValidDataImageUrl(url) {
                return typeof url === 'string' && /^data:image\/(png|jpeg|webp);base64,/i.test(url);
            }

            function isValidHexColor(hex) {
                return typeof hex === 'string' && /^#[0-9a-fA-F]{3,8}$/.test(hex);
            }

            function renderEmptyState() {
                const empty = document.createElement('div');
                empty.className = 'empty-state';

                const icon = document.createElement('i');
                icon.className = 'material-icons';
                icon.textContent = 'photo_library';

                const h3 = document.createElement('h3');
                h3.textContent = 'No Snapshots Yet';

                const p = document.createElement('p');
                p.textContent = 'Capture photos from the live camera with Daltonization filters to inspect colors and save them here.';

                const link = document.createElement('a');
                link.href = '../index.html';
                link.className = 'mdl-button mdl-js-button mdl-button--raised mdl-button--colored';
                link.style.marginTop = '16px';
                link.textContent = 'Open Camera';

                empty.append(icon, h3, p, link);
                container.replaceChildren(empty);
            }

            function render() {
                const list = getSnapshots();
                if (!Array.isArray(list) || list.length === 0) {
                    renderEmptyState();
                    return;
                }

                const grid = document.createElement('div');
                grid.className = 'history-grid';

                list.forEach((item, index) => {
                    if (!item || typeof item !== 'object') return;
                    const color = item.colorSample || { name: 'Sampled Color', hex: '#808080' };
                    const safeDataUrl = isValidDataImageUrl(item.dataUrl) ? item.dataUrl : '';
                    const safeHex = isValidHexColor(color.hex) ? color.hex : '#808080';
                    const itemId = String(item.id || `snap-${index}`);

                    const card = document.createElement('div');
                    card.className = 'snapshot-card';
                    card.dataset.id = itemId;

                    const imgWrap = document.createElement('div');
                    imgWrap.className = 'snapshot-img-wrap';

                    if (safeDataUrl) {
                        const img = document.createElement('img');
                        img.src = safeDataUrl;
                        img.alt = `Snapshot ${index + 1}`;
                        img.className = 'snapshot-img';
                        img.loading = 'lazy';
                        imgWrap.appendChild(img);
                    }

                    const badge = document.createElement('span');
                    badge.className = 'snapshot-badge';
                    badge.textContent = item.filterLabel || 'ORIGINAL';
                    imgWrap.appendChild(badge);

                    const meta = document.createElement('div');
                    meta.className = 'snapshot-meta';

                    const titleRow = document.createElement('div');
                    titleRow.className = 'snapshot-title-row';

                    const colorChip = document.createElement('div');
                    colorChip.className = 'snapshot-color-chip';

                    const chipCircle = document.createElement('div');
                    chipCircle.className = 'chip-circle';
                    chipCircle.style.backgroundColor = safeHex;

                    const colorNameSpan = document.createElement('span');
                    colorNameSpan.textContent = color.name || 'Sampled Color';
                    colorChip.append(chipCircle, colorNameSpan);

                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'snapshot-time';
                    timeSpan.textContent = item.formattedDate || '';

                    titleRow.append(colorChip, timeSpan);

                    const actions = document.createElement('div');
                    actions.className = 'snapshot-actions';

                    if (safeDataUrl) {
                        const dl = document.createElement('a');
                        dl.href = safeDataUrl;
                        dl.download = `picta-${itemId.replace(/[^a-zA-Z0-9_-]/g, '')}.jpg`;
                        dl.className = 'snapshot-btn';
                        dl.title = 'Download';
                        const dlIcon = document.createElement('i');
                        dlIcon.className = 'material-icons';
                        dlIcon.textContent = 'download';
                        dl.appendChild(dlIcon);
                        actions.appendChild(dl);
                    }

                    const delBtn = document.createElement('button');
                    delBtn.type = 'button';
                    delBtn.className = 'snapshot-btn btn-delete';
                    delBtn.dataset.id = itemId;
                    delBtn.title = 'Delete';
                    const delIcon = document.createElement('i');
                    delIcon.className = 'material-icons';
                    delIcon.textContent = 'delete';
                    delBtn.appendChild(delIcon);
                    delBtn.addEventListener('click', function (e) {
                        e.stopPropagation();
                        deleteSnapshot(this.dataset.id);
                    });
                    actions.appendChild(delBtn);

                    meta.append(titleRow, actions);
                    card.append(imgWrap, meta);
                    grid.appendChild(card);
                });

                container.replaceChildren(grid);
            }

            function deleteSnapshot(id) {
                let list = getSnapshots();
                list = list.filter(item => item.id !== id);
                saveSnapshots(list);
                render();
            }

            if (btnClearAll) {
                btnClearAll.addEventListener('click', function() {
                    if (confirm('Clear all saved snapshots from history?')) {
                        localStorage.removeItem('picta_snapshots');
                        render();
                    }
                });
            }

            render();
        })();
    </script>
    <script src="../novu-intro.js" data-project="picta" defer></script>
</body>
</html>
