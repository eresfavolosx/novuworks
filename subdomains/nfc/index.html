  <link rel="manifest" href="./manifest.json" />

  <style>
    /* Ensure fixed sidebar and sticky headers respect the 42px Novu Platform Topbar */
    :root, [data-theme="light"], html.light-theme {
      --bg-base: #f8fafc !important;
      --bg-surface: #ffffff !important;
      --bg-surface-elevated: #f8fafc !important;
      --border-color: rgba(15, 23, 42, 0.09) !important;
      --border-glass: rgba(15, 23, 42, 0.1) !important;
    }
    [data-theme="dark"] {
      --bg-base: #07090e !important;
      --bg-surface: #111622 !important;
      --bg-surface-elevated: #171e2e !important;
      --border-color: rgba(255, 255, 255, 0.08) !important;
      --border-glass: rgba(255, 255, 255, 0.1) !important;
    }
    /* Prevent muddy radial-gradient transparent interpolation on Safari in Light Mode */
    :root:not([data-theme="dark"]) body::before,
    [data-theme="light"] body::before,
    html.light-theme body::before {
      background: #f8fafc !important;
    }
    [data-theme="light"] .bottom-nav-container,
    html.light-theme .bottom-nav-container {
      background: rgba(255, 255, 255, 0.94) !important;
      border: 1px solid rgba(15, 23, 42, 0.12) !important;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.1) !important;
    }
    .sidebar {
      top: 42px !important;
      height: calc(100vh - 42px) !important;
      height: calc(100dvh - 42px) !important;
    }
    .page-header {
      top: 42px !important;
    }
    .hamburger-btn {
      top: calc(42px + 12px) !important;
    }
    @media (max-width: 600px) {
      .sidebar {
        top: 38px !important;
        height: calc(100vh - 38px) !important;
        height: calc(100dvh - 38px) !important;
      }
      .page-header {
        top: 38px !important;
      }
      .hamburger-btn {
        top: calc(38px + 10px) !important;
      }
      .bottom-nav {
        bottom: max(12px, env(safe-area-inset-bottom)) !important;
        left: 12px !important;
        right: 12px !important;
        height: 66px !important;
      }
      .login-card {
        padding: 24px 18px !important;
      }
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <script src="novu-intro.js" data-project="nfc" defer></script>
</body>

</html>
