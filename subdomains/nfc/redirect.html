<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting…</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0F0F1A;
            color: #E8E8F0;
        }

        .container {
            text-align: center;
            padding: 2rem;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(108, 92, 231, 0.2);
            border-top-color: #6C5CE7;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1.5rem;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        p {
            color: #A0A0C0;
            font-size: 0.9rem;
        }

        a {
            color: #A78BFA;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="spinner"></div>
        <p>Redirecting…</p>
    </div>
    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);
            const rawUrl = params.get('url');
            const id = params.get('id');
            const container = document.querySelector('.container');

            function showSafeFallback(message) {
                if (!container) return;
                const pMsg = document.createElement('p');
                pMsg.textContent = message;
                const pLink = document.createElement('p');
                pLink.style.marginTop = '1rem';
                const link = document.createElement('a');
                link.href = '/';
                link.textContent = 'Go to NFC Tag Manager';
                pLink.appendChild(link);
                container.replaceChildren(pMsg, pLink);
            }

            if (!rawUrl) {
                showSafeFallback('No redirect URL specified.');
                return;
            }

            let parsed;
            try {
                parsed = new URL(rawUrl);
            } catch (_) {
                showSafeFallback('Blocked invalid redirect URL.');
                return;
            }

            const hostname = parsed.hostname.toLowerCase();
            const isAllowedHost = hostname === 'novu.works' || hostname.endsWith('.novu.works');
            if (parsed.protocol !== 'https:' || !isAllowedHost) {
                showSafeFallback('Blocked unsafe or off-domain redirect target.');
                return;
            }

            // Track tap if tracking is available
            if (id) {
                try {
                    const STORAGE_KEY = 'nfc_tag_manager';
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) {
                        const data = JSON.parse(raw);
                        const link = data.links?.find(l => l.id === id);
                        if (link) {
                            link.clicks = (link.clicks || 0) + 1;
                            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                        }
                    }
                } catch (e) {
                    // Silent fail — redirect is more important
                }
            }

            window.location.replace(parsed.toString());
        })();
    </script>
</body>

</html>
